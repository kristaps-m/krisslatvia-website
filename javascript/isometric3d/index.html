<!doctype html>
<html lang="en" style="background-color: rgb(214, 218, 218)">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Isometric 3d</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/mobileScreen.css" />
    <body>
      <script id="replace_with_navbar" src="/navbar/nav.js"></script>
    </body>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        align-items: center;
        text-align: center;
        align-content: center;
      }
    </style>
  </head>

  <body>
    <h1>Isometric 3d</h1>
    <p id="theTitle">Snake?</p>
    <div style="margin-right: 20px; white-space: nowrap">
      <label for="isometric3dAction">Select action:</label>
      <select
        name="isometric3dAction"
        id="isometric3dAction"
        onchange="newGame()"
      >
        <option value="casual" selected>Casual</option>
        <option value="snake">Snake</option>
        <!-- <option value="16 16 40">Intermediate</option>
        <option value="16 30 99" class="doNotShowInMobile">Expert</option>
        <option value="20 20 50" class="doNotShowInMobile">Challenging</option>
        <option value="30 30 150" class="doNotShowInMobile">Insane</option> -->
      </select>
      <button id="toggleRegularGrid" style="background-color: #ff9999; display: none; margin-left: 1rem;"
              onclick="toggleRegularGridVisibility()">
        Hide Regular Grid
      </button>
      <button style="background-color: greenyellow; display: inline-block; margin-left: 1rem;" onclick="newGame()">
        NEW GAME!
      </button>
    </div>
    <canvas
      id="myCanvas5"
      style="border: 4px solid #000000; background-color: white"
    ></canvas>

    <script src="constants.js"></script>
    <script src="theSnake.js"></script>
    <script src="script.js"></script>
  </body>
</html>
