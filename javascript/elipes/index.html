<!doctype html>
<html lang="en" style="background-color: rgb(214, 218, 218)">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elipse</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/mobileScreen.css" />
    <body>
      <script id="replace_with_navbar" src="../../navbar/nav.js"></script>
      <!--Nav bar script;go:NB/nav.html-->
    </body>
    <style>
      body {
        align-items: center;
        text-align: center;
        align-content: center;
      }

      .controls {
        margin-top: 15px;
        display: flex;
        justify-content: center;
        gap: 30px;
        font-family: Arial, sans-serif;
      }

      .control-group {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .control-group label {
        margin-bottom: 5px;
        font-size: 14px;
        color: #333;
      }

      input[type="range"] {
        width: 200px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <h1>Elipse</h1>
    <canvas
      id="myCanvas5"
      style="border: 4px solid #000000; background-color: white"
    ></canvas>

    <!-- ─── Ellipse dimension sliders ────────────────────────────── -->
    <div class="controls">
      <div class="control-group">
        <label for="ellipseWidth">Ellipse Width (rx): <span id="widthValue">100</span></label>
        <input type="range" id="ellipseWidth" min="30" max="200" value="100" oninput="updateEllipseWidth(this.value); document.getElementById('widthValue').textContent = this.value;" />
      </div>

      <div class="control-group">
        <label for="ellipseHeight">Ellipse Height (ry): <span id="heightValue">150</span></label>
        <input type="range" id="ellipseHeight" min="30" max="240" value="150" oninput="updateEllipseHeight(this.value); document.getElementById('heightValue').textContent = this.value;" />
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
